services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: webgame, POSTGRES_PASSWORD: webgame, POSTGRES_DB: webgame }
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data", "./infra/postgres-init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes: { postgres-data: {} }
